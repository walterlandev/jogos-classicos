<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Neon - Jogos Clássicos</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/snake.css">
</head>
<body>

    <header class="topbar">
        <h1 class="logo">Snake Neon</h1>
        
        <nav class="nav-area">
            <a href="index.html" class="btn-neon">⬅ Voltar</a>
            
            <div id="statusLogado" style="display: none; align-items: center; gap: 10px;">
                <span class="welcome-text">Player: <strong id="userName">...</strong></span>
            </div>
        </nav>
    </header>

    <main>
        <div class="neon-box game-wrapper">
            
            <div class="canvas-area">
                <canvas id="snakeGame" width="400" height="400"></canvas>
            </div>

            <aside class="hud-sidebar">
                <div class="score-board">
                    <p>PONTOS</p>
                    <span id="snakeScore" class="neon-text">0000</span>
                </div>
                
                <div class="score-board">
                    <p>RECORDE</p>
                    <span id="userScore" class="neon-text">0</span>
                </div>
                <div class="score-board">
                    <p>NÍVEL</p>
                    <span id="snakeLevel" class="neon-text">0</span>
                </div>

                <button onclick="startGame()" class="btn-neon btn-start">
                    ▶ INICIAR
                </button>
            </aside>

        </div>

        <div class="mobile-controls">
            <div class="d-pad">
                <div></div>
                <button class="btn-dir" ontouchstart="handleMove(event,'up')">▲</button>
                <div></div>

                <button class="btn-dir" ontouchstart="handleMove(event,'left')">◀</button>
                <div class="center-pad"></div>
                <button class="btn-dir" ontouchstart="handleMove(event,'right')">▶</button>

                <div></div>
                <button class="btn-dir" ontouchstart="handleMove(event,'down')">▼</button>
                <div></div>
            </div>
        </div>

    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/snake.js"></script>
    <footer class="footer">
        <p>© 2026 - jogos classicos WAS.</p>
    </footer>
</body>

</html>
