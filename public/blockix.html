<!DOCTYPE html>
<html lang="pt-BR" data-tema="fliperama">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d7262e">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Blockix — Jogos Clássicos</title>
    <script>try{var t=localStorage.getItem('tema');if(/^[a-z_]+$/.test(t))document.documentElement.dataset.tema=t}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;600;700&family=Rubik+Mono+One&family=Rubik:wght@400;500;700&family=Silkscreen:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=Cabin+Sketch:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/temas/fliperama.css">
    <link rel="stylesheet" href="css/temas/cartucho.css">
    <link rel="stylesheet" href="css/temas/lcd.css">
    <link rel="stylesheet" href="css/temas/lousa.css">
</head>
<body class="pagina-jogo" data-jogo="blockix">
    <header class="topo">
        <a class="botao botao-icone" href="./" aria-label="Voltar ao menu">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="marca">Blockix</h1>
        <div class="acoes-topo">
        <button class="botao botao-icone" type="button" id="botaoSom" aria-pressed="true">
            <svg class="icone som-ligado" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
            <svg class="icone som-desligado" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
        <button class="botao botao-icone" type="button" id="botaoTema">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1-.8-1.4-.8-2.3 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle class="cheio" cx="7.5" cy="11" r="1.4"/><circle class="cheio" cx="10.5" cy="7" r="1.4"/><circle class="cheio" cx="15" cy="7.5" r="1.4"/></svg>
        </button>
        </div>
    </header>

    <main class="jogo" style="--proporcao: 0.5; --largura-max: 400px">
        <section class="placar" aria-label="Placar">
            <dl class="placar-lista">
                <div class="placar-item"><dt>Pontos</dt><dd><span id="pontos">0</span><small class="placar-extra">Recorde <span id="userScore">—</span></small></dd></div>
                <div class="placar-item"><dt>Nível</dt><dd><span id="nivel">1</span><small class="placar-extra"><span id="linhas">0</span> linhas</small></dd></div>
                <div class="placar-item"><dt>Guardada</dt><dd><canvas id="guardada" width="80" height="80" role="img" aria-label="Peça guardada"></canvas></dd></div>
                <div class="placar-item"><dt>Próxima</dt><dd><canvas id="proxima" width="80" height="80" role="img" aria-label="Próxima peça"></canvas></dd></div>
                <div class="placar-item so-pc-bloco"><dt>Depois</dt><dd><canvas id="fila" width="80" height="150" role="img" aria-label="Peças seguintes"></canvas></dd></div>
            </dl>
            <button class="botao so-pc" type="button" data-acao="pausa">Pausar (P)</button>
        </section>

        <div class="campo">
            <div class="tela">
                <canvas id="canvas" width="300" height="600" role="img" aria-label="Campo do Blockix"></canvas>
                <p class="aviso-jogo" id="avisoJogo" aria-live="polite"></p>
                <div class="camada" id="camadaInicio">
                    <p class="camada-titulo">Blockix</p>
                    <div class="fim-de-jogo" role="status" hidden></div>
                    <label class="seletor-nivel">Começar no nível
                        <select id="nivelInicial"><option value="1">1</option></select>
                    </label>
                    <button class="botao botao-primario" type="button" id="botaoJogar">Jogar</button>
                    <p class="dica"><span class="so-pc">Setas movem, seta para cima ou X gira, Z gira ao contrário, Espaço cai, C guarda, P pausa.</span><span class="so-toque">Segure as setas para repetir o movimento.</span></p>
                </div>
                <div class="camada" id="camadaPausa" hidden>
                    <p class="camada-titulo">Pausado</p>
                    <button class="botao botao-primario" type="button" data-acao="pausa">Continuar</button>
                </div>
            </div>
        </div>

        <div class="controles controles-duplos">
            <div class="linha">
                <button class="controle controle-pequeno" type="button" data-acao="hold" aria-label="Guardar peça">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M12 3v9M8.5 8.5L12 12l3.5-3.5"/></svg>
                </button>
                <button class="controle controle-pequeno" type="button" data-acao="pausa" aria-label="Pausar">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
                </button>
                <button class="controle controle-pequeno controle-largo" type="button" data-acao="drop" aria-label="Cair de uma vez">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l6 6 6-6M6 11l6 6 6-6M5 21h14"/></svg>
                </button>
            </div>
            <div class="linha">
                <button class="controle" type="button" data-acao="left" aria-label="Mover para a esquerda">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
                </button>
                <button class="controle" type="button" data-acao="down" aria-label="Descer">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
                </button>
                <button class="controle" type="button" data-acao="right" aria-label="Mover para a direita">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                </button>
                <button class="controle" type="button" data-acao="rotate" aria-label="Girar">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script type="module" src="js/temas.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/blockix.js"></script>
</body>
</html>
