<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Neon - Jogos Clássicos</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tetris.css">
</head>
<body>

    <header class="topbar">
        <h1 class="logo">Tetris Color</h1>
        <nav class="nav-area">
            <a href="index.html" class="btn-neon">⬅ Voltar</a>
        </nav>
    </header>

    <main class="game-container">
        
        <div class="game-wrapper">
            
            <div class="monitor-frame neon-box">
                <canvas id="canvas" width="300" height="600"></canvas>
                <button id="startBtnOverlay" onclick="startGame()" class="btn-start-overlay">▶ JOGAR</button>
                
                <div id="pauseOverlay" class="pause-msg" style="display:none;">PAUSADO</div>
            </div>

            <aside class="hud-sidebar desktop-only">
                <div class="hud-item">
                    <p>PRÓXIMO</p>
                    <canvas id="upcomingPC" width="100" height="100"></canvas>
                </div>
                <div class="hud-item">
                    <p>SCORE</p>
                    <span id="scorePC" class="neon-text-cyan">00000</span>
                </div>
                <div class="hud-item">
                    <p>NÍVEL</p>
                    <span id="levelPC" class="neon-text-green">1</span>
                </div>
                <button onclick="togglePause()" class="btn-neon">PAUSAR</button>
            </aside>

        </div>

        <div class="mobile-controls">
            <div class="action-area">
                <button class="btn-dir rotate" ontouchstart="handleInput('rotate', event)">↻</button>
            </div>

            <div class="d-pad">
                <button class="btn-dir left" ontouchstart="handleInput('left', event)">◀</button>
                <button class="btn-dir down" ontouchstart="handleInput('down', event)">▼</button>
                <button class="btn-dir right" ontouchstart="handleInput('right', event)">▶</button>
            </div>
            
            <button class="btn-pause-mob" ontouchstart="togglePause()">II</button>
        </div>

        <footer class="hud-footer mobile-only">
            <div class="hud-item-mini">
                <p>PRÓXIMO</p>
                <canvas id="upcomingMob" width="60" height="60"></canvas>
            </div>
            <div class="hud-item-mini">
                <p>PONTOS</p>
                <span id="scoreMob" class="neon-text-cyan">0</span>
            </div>
            <div class="hud-item-mini">
                <p>NÍVEL</p>
                <span id="levelMob" class="neon-text-green">1</span>
            </div>
        </footer>

    </main>

    <script type="module" src="js/auth.js"></script>
    <script src="js/tetris.js"></script>
</body>
<footer class="footer">
    <p>© 2026 - jogos classicos WAS.</p>
</footer>

</html>
